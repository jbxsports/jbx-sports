<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa de satisfação · JBX Sports</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff751f;--orange-dark:#e05a08;--bg:#faf9f7;--card:#fff;--border:rgba(42,37,32,.10);--text:#2a2520;--muted:#7a7068;--ok:#16a34a;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Ubuntu',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
.topo{background:#0a0a0a;padding:18px 20px;display:flex;justify-content:center;}
.topo .logo{height:22px;fill:#fff;display:block;}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px;}
.hero{margin:6px 0 18px;}
.hero .ey{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);}
.hero h1{font-size:26px;line-height:1.15;letter-spacing:-.5px;margin:6px 0 4px;}
.hero p{color:var(--muted);font-size:14px;}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 16px;}
.prog-bar{flex:1;height:6px;background:#ece8e2;border-radius:99px;overflow:hidden;}
.prog-bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s;}
.prog span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 18px;box-shadow:0 2px 10px rgba(42,37,32,.05);}
.card h2{font-size:19px;letter-spacing:-.3px;}
.card .desc{color:var(--muted);font-size:13.5px;margin:4px 0 6px;}
.q{padding:16px 0;border-top:1px solid var(--border);}
.q:first-of-type{border-top:none;}
.q-rot{font-size:15px;font-weight:500;line-height:1.35;margin-bottom:10px;}
.q-rot .ob{color:var(--orange);}
.q.erro .q-rot{color:var(--bad);}
.q.erro .q-rot::after{content:" · responda esta";font-size:12px;font-weight:700;}
.esc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.esc button,.nps button,.op button{font-family:inherit;cursor:pointer;border:1.5px solid rgba(42,37,32,.14);background:#fff;color:var(--text);border-radius:10px;transition:all .12s;}
.esc button{padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.esc button b{font-size:17px;}
.esc button small{font-size:10px;color:var(--muted);}
.esc button.on{background:var(--orange);border-color:var(--orange);color:#fff;}
.esc button.on small{color:#fff;}
.na{margin-top:7px;font-size:12.5px !important;padding:7px 12px !important;color:var(--muted) !important;}
.na.on{background:#2a2520 !important;border-color:#2a2520 !important;color:#fff !important;}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;}
.nps button{padding:11px 0;font-size:15px;font-weight:700;}
.nps button.on.d{background:var(--bad);border-color:var(--bad);color:#fff;}
.nps button.on.n{background:#a8a29e;border-color:#a8a29e;color:#fff;}
.nps button.on.p{background:var(--ok);border-color:var(--ok);color:#fff;}
.nps-leg{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;}
.op{display:flex;flex-direction:column;gap:7px;}
.op button{padding:12px 14px;text-align:left;font-size:14.5px;display:flex;align-items:center;gap:10px;}
.op button::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid rgba(42,37,32,.25);flex:none;}
.op button.on{border-color:var(--orange);background:#fff5ee;}
.op button.on::before{border-color:var(--orange);background:radial-gradient(circle,var(--orange) 45%,transparent 50%);}
textarea,input[type=text],input[type=email],input[type=tel]{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:#f7f5f2;border:1.5px solid rgba(42,37,32,.12);border-radius:10px;padding:12px 13px;}
textarea{min-height:90px;resize:vertical;}
textarea:focus,input:focus{outline:none;border-color:var(--orange);background:#fff;}
.campo{margin-bottom:12px;}
.campo label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.aceite{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;margin:6px 0 4px;cursor:pointer;}
.aceite input{width:18px;height:18px;accent-color:var(--orange);flex:none;margin-top:1px;}
.lgpd{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px;background:#f7f5f2;border-radius:10px;padding:10px 12px;}
.nav{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;font-family:inherit;font-size:15.5px;font-weight:700;border-radius:12px;padding:15px;cursor:pointer;border:none;background:var(--orange);color:#fff;}
.btn:hover{background:var(--orange-dark);}
.btn:disabled{opacity:.6;cursor:wait;}
.btn.sec{flex:0 0 auto;background:#ece8e2;color:var(--text);padding:15px 20px;}
.msg{font-size:13.5px;color:var(--bad);margin-top:10px;min-height:18px;text-align:center;}
.centro{text-align:center;padding:34px 20px;}
.centro .ic{font-size:46px;margin-bottom:10px;}
.centro h2{font-size:22px;margin-bottom:8px;}
.centro p{color:var(--muted);font-size:14.5px;line-height:1.5;}
.intro-lista{list-style:none;margin:14px 0 4px;display:grid;gap:6px;}
.intro-lista li{font-size:14px;display:flex;gap:10px;align-items:center;}
.intro-lista li b{width:24px;height:24px;border-radius:50%;background:#fff1e6;color:var(--orange);font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}
.rodape{text-align:center;font-size:12px;color:var(--muted);margin-top:24px;}
@media(max-width:420px){.nps{grid-template-columns:repeat(6,1fr);}.esc button small{font-size:9px;}.hero h1{font-size:22px;}}
</style>
</head>

    <div class="ey">Pesquisa de satisfação</div>

<script>
const SB_URL = 'https://acxfzdtzxaahsqnlxdgw.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjeGZ6ZHR6eGFhaHNxbmx4ZGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Njc5NTAsImV4cCI6MjA5NjE0Mzk1MH0.uZ_G55BKmV24tn62ZmjjFzYxtBypoq7OLWjTMmKfRRk';
const ESC_ROT = ['','Péssimo','Ruim','Regular','Bom','Excelente'];
const ERROS = {
  nao_encontrada:'Não encontramos esta pesquisa. Confira o link que você recebeu.',
  encerrada:'Esta pesquisa já foi encerrada. Obrigado pelo interesse!',
  ja_respondeu:'Já recebemos uma resposta com esse WhatsApp ou e-mail. Obrigado!',
  muitas:'Muitas respostas seguidas desta conexão. Tente de novo mais tarde.',
  faltou:'Faltou responder uma pergunta obrigatória',
  sem_nota:'Faltou a nota de 0 a 10.'
};
let PESQ = null, slug = '', etapa = -1, resp = {};
try { const s = sessionStorage.getItem('jbx_nps_' + location.search); if (s) resp = JSON.parse(s) || {}; } catch (e) {}

async function rpc(fn, params) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(params) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function msg(t) { document.getElementById('msg').textContent = t || ''; }
function guardar() { try { sessionStorage.setItem('jbx_nps_' + location.search, JSON.stringify(resp)); } catch (e) {} }
function totalEtapas() { return PESQ.blocos.length + 1; } // + identificação

function centro(ic, tit, txt) {
  const p = document.getElementById('palco'); p.innerHTML = '';
  const c = el('div', 'centro'); c.appendChild(el('div', 'ic', ic)); c.appendChild(el('h2', null, tit)); c.appendChild(el('p', null, txt));
  p.appendChild(c); return c;
}

async function iniciar() {
  const qs = new URLSearchParams(location.search);
  slug = (qs.get('p') || qs.get('pesquisa') || '').trim().toLowerCase();
  if (!slug) { centro('🔎', 'Link incompleto', ERROS.nao_encontrada); return; }
  try {
    const r = await rpc('nps_pesquisa_publica', { p_slug: slug });
    if (!r || !r.ok) { centro('🔎', 'Pesquisa não encontrada', ERROS.nao_encontrada); return; }
    PESQ = r;
  } catch (e) { centro('⚠️', 'Não foi possível carregar', 'Verifique sua conexão e recarregue a página.'); return; }
  document.title = PESQ.titulo + ' · Pesquisa de satisfação';
  document.getElementById('hero').style.display = '';
  document.getElementById('h-titulo').textContent = PESQ.titulo;
  document.getElementById('h-sub').textContent = PESQ.subtitulo || '';
  if (!PESQ.aberta) { centro('🏁', 'Pesquisa encerrada', ERROS.encerrada); return; }
  if (sessionStorage.getItem('jbx_nps_ok_' + slug)) { telaFim(); return; }
  telaIntro();
}

function telaIntro() {
  etapa = -1; document.getElementById('prog').style.display = 'none';
  const p = document.getElementById('palco'); p.innerHTML = '';
  const c = el('div'); c.style.padding = '4px 2px';
  c.appendChild(el('h2', null, 'Sua opinião faz a próxima edição'));
  c.appendChild(el('p', 'desc', 'São ' + PESQ.blocos.length + ' blocos rápidos — leva uns 3 minutos. Responda com sinceridade: é isso que usamos para melhorar.'));
  const ul = el('ul', 'intro-lista');
  PESQ.blocos.forEach(function (b, i) { const li = el('li'); li.appendChild(el('b', null, String(i + 1))); li.appendChild(el('span', null, b.titulo)); ul.appendChild(li); });
  c.appendChild(ul);
  const nav = el('div', 'nav'); const b = el('button', 'btn', 'Começar'); b.onclick = function () { irPara(0); };
  nav.appendChild(b); c.appendChild(nav); p.appendChild(c);
}

function irPara(i) {
  etapa = i; msg('');
  const tot = totalEtapas();
  document.getElementById('prog').style.display = '';
  document.getElementById('prog-i').style.width = Math.round((i + 1) / tot * 100) + '%';
  document.getElementById('prog-t').textContent = 'Bloco ' + (i + 1) + ' de ' + tot;
  if (i < PESQ.blocos.length) renderBloco(PESQ.blocos[i]); else renderIdent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderBloco(b) {
  const p = document.getElementById('palco'); p.innerHTML = '';
  p.appendChild(el('h2', null, b.titulo));
  if (b.descricao) p.appendChild(el('p', 'desc', b.descricao));
  (b.perguntas || []).forEach(function (q) { p.appendChild(renderPergunta(q)); });
  p.appendChild(navBotoes(etapa === totalEtapas() - 1 ? 'Enviar' : 'Continuar'));
}

function renderPergunta(q) {
  const box = el('div', 'q'); box.dataset.id = q.id;
  const rot = el('div', 'q-rot', q.rotulo);
  if (q.obrig) { const o = el('span', 'ob', ' *'); rot.appendChild(o); }
  box.appendChild(rot);
  const atual = resp[q.id];
  if (q.tipo === 'escala') {
    const g = el('div', 'esc');
    for (let n = 1; n <= 5; n++) {
      const bt = el('button'); bt.type = 'button';
      bt.appendChild(el('b', null, String(n))); bt.appendChild(el('small', null, ESC_ROT[n]));
      if (String(atual) === String(n)) bt.classList.add('on');
      bt.onclick = function () { marcar(q.id, String(n), box); };
      g.appendChild(bt);
    }
    box.appendChild(g);
    if (q.na) {
      const na = el('button', 'na', 'Não usei / não se aplica'); na.type = 'button';
      if (String(atual) === '0') na.classList.add('on');
      na.onclick = function () { marcar(q.id, '0', box); };
      box.appendChild(na);
    }
  } else if (q.tipo === 'nps') {
    const g = el('div', 'nps');
    for (let n = 0; n <= 10; n++) {
      const bt = el('button', n <= 6 ? 'd' : (n <= 8 ? 'n' : 'p'), String(n)); bt.type = 'button';
      if (String(atual) === String(n)) bt.classList.add('on');
      bt.onclick = function () { marcar(q.id, String(n), box); };
      g.appendChild(bt);
    }
    box.appendChild(g);
    const leg = el('div', 'nps-leg'); leg.appendChild(el('span', null, '0 · Não recomendaria')); leg.appendChild(el('span', null, '10 · Recomendaria muito'));
    box.appendChild(leg);
  } else if (q.tipo === 'opcao') {
    const g = el('div', 'op');
    (q.opcoes || []).forEach(function (o) {
      const bt = el('button', null, o); bt.type = 'button';
      if (atual === o) bt.classList.add('on');
      bt.onclick = function () { marcar(q.id, o, box); };
      g.appendChild(bt);
    });
    box.appendChild(g);
  } else {
    const t = el('textarea'); t.maxLength = 1000; t.placeholder = 'Escreva aqui (opcional)';
    t.value = atual || '';
    t.oninput = function () { resp[q.id] = t.value; guardar(); };
    box.appendChild(t);
  }
  return box;
}

function marcar(id, valor, box) {
  resp[id] = valor; guardar();
  box.classList.remove('erro');
  box.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
  const bts = box.querySelectorAll('button');
  bts.forEach(function (b) {
    const v = b.classList.contains('na') ? '0' : (b.querySelector('b') ? b.querySelector('b').textContent : b.textContent);
    if (v === valor) b.classList.add('on');
  });
}

function navBotoes(rotulo) {
  const nav = el('div', 'nav');
  const v = el('button', 'btn sec', '← Voltar'); v.type = 'button';
  v.onclick = function () { if (etapa <= 0) telaIntro(); else irPara(etapa - 1); };
  const a = el('button', 'btn', rotulo); a.type = 'button'; a.id = 'btn-avancar';
  a.onclick = avancar;
  nav.appendChild(v); nav.appendChild(a); return nav;
}

function validarBloco(b) {
  let primeiro = null;
  (b.perguntas || []).forEach(function (q) {
    const v = resp[q.id];
    const vazio = v == null || String(v).trim() === '';
    if (q.obrig && vazio) {
      const box = document.querySelector('.q[data-id="' + q.id + '"]');
      if (box) { box.classList.add('erro'); if (!primeiro) primeiro = box; }
    }
  });
  if (primeiro) { msg('Responda as perguntas marcadas para continuar.'); primeiro.scrollIntoView({ behavior:'smooth', block:'center' }); return false; }
  return true;
}

function avancar() {
  if (etapa < PESQ.blocos.length) {
    if (!validarBloco(PESQ.blocos[etapa])) return;
    irPara(etapa + 1);
  } else enviar();
}

function renderIdent() {
  const p = document.getElementById('palco'); p.innerHTML = '';
  p.appendChild(el('h2', null, 'Identificação (opcional)'));
  p.appendChild(el('p', 'desc', 'Se quiser, deixe seu contato. Assim podemos falar com você sobre a sua resposta. Pode deixar em branco e enviar.'));
  const campos = [['nome','Nome','text','Seu nome'],['whatsapp','WhatsApp','tel','(16) 99999-9999'],['email','E-mail','email','voce@email.com']];
  campos.forEach(function (c) {
    const d = el('div', 'campo'); d.appendChild(el('label', null, c[1]));
    const i = el('input'); i.type = c[2]; i.placeholder = c[3]; i.id = 'id-' + c[0]; i.value = resp['_' + c[0]] || '';
    if (c[0] === 'whatsapp') i.inputMode = 'tel';
    i.oninput = function () {
      if (c[0] === 'whatsapp') i.value = mascTel(i.value);
      resp['_' + c[0]] = i.value; guardar();
    };
    d.appendChild(i); p.appendChild(d);
  });
  const lb = el('label', 'aceite'); const ck = el('input'); ck.type = 'checkbox'; ck.id = 'id-aceite'; ck.checked = !!resp._aceite;
  ck.onchange = function () { resp._aceite = ck.checked; guardar(); };
  lb.appendChild(ck); lb.appendChild(el('span', null, 'Autorizo a JBX Sports a entrar em contato comigo sobre esta pesquisa.'));
  p.appendChild(lb);
  p.appendChild(el('div', 'lgpd', 'Suas respostas são usadas somente pela JBX Sports e pela organização da prova para melhorar o evento. Os dados de contato são opcionais, não são compartilhados e só serão usados para contato se você autorizar acima (LGPD).'));
  p.appendChild(navBotoes('Enviar respostas'));
}

function mascTel(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}

async function enviar() {
  const email = (resp._email || '').trim();
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg('Confira o e-mail — ou deixe em branco.'); return; }
  const wpp = (resp._whatsapp || '').replace(/\D/g, '');
  if (wpp && wpp.length < 10) { msg('Confira o WhatsApp com DDD — ou deixe em branco.'); return; }
  const respostas = {};
  PESQ.blocos.forEach(function (b) { (b.perguntas || []).forEach(function (q) { if (resp[q.id] != null) respostas[q.id] = String(resp[q.id]); }); });
  const btn = document.getElementById('btn-avancar'); btn.disabled = true; btn.textContent = 'Enviando…'; msg('');
  try {
    const r = await rpc('nps_responder', { p_slug: slug, p_dados: {
      respostas: respostas, nome: (resp._nome || '').trim(), whatsapp: wpp, email: email, aceita_contato: !!resp._aceite } });
    if (!r || !r.ok) {
      const e = r && r.erro;
      if (e === 'ja_respondeu') { finalizar(); return; }
      let t = ERROS[e] || 'Não foi possível enviar. Tente novamente.';
      if (e === 'faltou' && r.pergunta) t += ': "' + r.pergunta + '".';
      msg(t); btn.disabled = false; btn.textContent = 'Enviar respostas'; return;
    }
    finalizar();
  } catch (e) {
    msg('Falha de conexão. Suas respostas estão guardadas — tente enviar de novo.');
    btn.disabled = false; btn.textContent = 'Enviar respostas';
  }
}

function finalizar() {
  try { sessionStorage.removeItem('jbx_nps_' + location.search); sessionStorage.setItem('jbx_nps_ok_' + slug, '1'); } catch (e) {}
  resp = {}; telaFim();
}
function telaFim() {
  document.getElementById('prog').style.display = 'none';
  centro('🧡', 'Obrigado pela sua resposta!', 'Sua avaliação já chegou para a nossa equipe. Ela vai direto para o planejamento da próxima edição. Nos vemos na largada!');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

iniciar();
</script>
</body>
</html>
